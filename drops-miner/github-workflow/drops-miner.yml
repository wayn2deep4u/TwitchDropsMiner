# Builds the Drops Miner installer on Windows when anything under drops-miner/ changes.
# The installer is attached to the run as the "drops-miner-windows" artifact.
name: Drops Miner for Windows

on:
  push:
    paths: ["drops-miner/**", ".github/workflows/drops-miner.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: drops-miner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drops-miner
      - name: Test the engine
        run: cargo test -p drops-miner-core
      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: drops-miner-windows
          path: drops-miner/target/release/bundle/nsis/*.exe
