[package]
name = "drops-miner"
version = "1.1.1"
edition = "2021"
description = "Drops Miner: mines Twitch drops in the background (a Rust port of DevilXD's TwitchDropsMiner)"
publish = false

[lib]
# the app's code lives in a library so it can also be checked without starting a window
name = "drops_miner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drops-miner-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# Desktop-only plugins (Windows is the target; they also build on Linux/macOS for development)
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
